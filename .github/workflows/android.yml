name: Android Phase 0

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "native/**"
      - "gradle/**"
      - ".github/workflows/android.yml"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "app/**"
      - "native/**"
      - "gradle/**"
      - ".github/workflows/android.yml"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phase0
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test Phase 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"

          SDK_ROOT="$HOME/.android/sdk"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "CARGO_NDK_PLATFORM=23" >> "$GITHUB_ENV"

      - name: Set up Rust 1.100.0
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path native/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --workspace --manifest-path native/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --workspace --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Test and assemble Android app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Phase 0 APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kb-ai-phase0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
