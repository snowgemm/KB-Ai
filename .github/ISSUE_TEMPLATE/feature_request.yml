name: Feature request
description: Propose a user-facing improvement for KB-Ai.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing platform capabilities or simpler approaches.
  - type: textarea
    id: privacy
    attributes:
      label: Data and privacy impact
      description: Does this feature read, store, or transmit typed text, clipboard data, images, audio, or other user content?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would demonstrate the feature works.
