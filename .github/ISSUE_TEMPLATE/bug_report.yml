name: Bug report
description: Report a reproducible KB-Ai defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, private messages, authentication codes, real typed content, or screenshots containing personal information.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the observed behavior without sharing private text.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps using synthetic, non-sensitive sample text.
      placeholder: |
        1. Open a test field.
        2. Select the relevant input mode.
        3. Perform the action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: KB-Ai version or commit
      placeholder: Not available yet if testing a local development build
  - type: input
    id: android_version
    attributes:
      label: Android version
  - type: input
    id: device
    attributes:
      label: Device and ABI
  - type: dropdown
    id: input_mode
    attributes:
      label: Input mode
      options:
        - Vietnamese Telex
        - Vietnamese VNI
        - English
        - Number / symbols
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, personal text, authentication codes, and sensitive screenshots.
          required: true
